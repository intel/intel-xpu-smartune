[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartune-sdk"
version = "0.2.0"
description = "Client SDK, CLI (queries plus confirmed balancer control) and read-only MCP server for the Intel XPU SmarTune REST API"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
# The MCP server (smartune-mcp) uses MCP SDK 2.x (MCPServer), which needs Python >= 3.10.
mcp = ["mcp>=2,<3; python_version >= '3.10'"]

[project.scripts]
smartune = "smartune_sdk.cli:main"
smartune-mcp = "smartune_sdk.mcp_server:main"

[tool.setuptools]
packages = ["smartune_sdk"]
