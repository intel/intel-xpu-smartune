cgroup_mount: "/sys/fs/cgroup"
vendor: "generic"  # admin, generic
thresholds:
  low: 0.4
  medium: 0.6
  high: 0.8
  critical: 1.0
# Disk-IO pressure bands, kept SEPARATE from the system `thresholds` above so the disk
# channel can be tuned without shifting when system pressure reaches critical. Required,
# and with no fallback to `thresholds` — borrowing the system bands would silently undo
# any disk-side tuning done here.
#   low/high  – also the endpoints of the saturation ramp in
#               PressureAnalyzer.classify_disk_pressure: below `low` an IO stall is NOT
#               attributed to the local disk; at/above `high` it fully is.
#   medium    – the per-disk `is_busy` mark (breadth reporting in the UI).
#   critical  – the throttle trigger. 1.0 keeps it aligned with "100%" in the UI and with
#               the system channel, which also requires the score to top out.
disk_thresholds:
  low: 0.4
  medium: 0.6
  high: 0.8
  critical: 1.0
# How the io PSI maps to the "stall severity" that gates disk_combined (see
# PressureAnalyzer.classify_disk_pressure): stall = min(1, some*some + full*full).
#   full = every non-idle task is blocked on IO — the strongest signal, but on a multi-core
#          box a single CPU-bound thread drives it to 0, so it is rare.
#   some = at least one task is blocked on IO — common under real disk load.
# With some=0.5 (and io.some capped at 1.0) the `some` term alone can never saturate the
# stall, so reaching critical effectively requires io.full >= ~1/3. Raise the `some` weight
# if measurements show full staying low while some is high — misattribution is already
# prevented by the saturation ramp, not by these weights.
disk_psi_weights:
  some: 0.5
  full: 3.0
# Calibration knobs for the per-disk USE model (monitor/disk_pressure.py). Every key is
# optional and falls back to the in-code default; values are re-read each tick, so an edit
# here takes effect without restarting the service. Raise these to make the same hardware
# state read as MORE pressure.
disk_pressure_model:
  # Weights of the three USE sub-signals. Latency dominates because it is what users feel;
  # util is only a tie-breaker (a parallel device sits at 100% util with headroom to spare).
  sub_weights:
    latency: 0.55   # await(ms) vs await_half_ms
    queue: 0.35     # avg queue depth (aqu) vs queue_half
    util: 0.10      # %util vs util_half_pct
  sigmoid_k: 8.0    # squash steepness; larger = sharper transition at the half-point
  # Every "_half" below is the metric value that reads as 0.5, given PER MEDIA CLASS
  # (hdd / sata_ssd / nvme / usb / mmc / unknown) -- that is where "busy" is made relative
  # to what the device can sustain: a 20 ms await is routine for an HDD and catastrophic
  # for an NVMe, and a queue of 4 is nothing to an NVMe but a backlog on a USB bridge. A
  # single number is also accepted for any of these maps and is then applied to all media
  # classes. Because P_disk comes out media-normalised, the busy mark applied to it
  # (disk_thresholds.medium) stays media-agnostic on purpose -- per-media there too would
  # apply the correction twice. Any class may be omitted and keeps its in-code default.
  #
  # `unknown` covers anything whose media could not be determined (virtio, device-mapper,
  # md) and carries the HDD numbers, i.e. the most tolerant ones -- an unidentifiable disk
  # should read as calm rather than be judged by an NVMe yardstick it cannot meet.
  #
  # %util that reads as 0.5. Media-dependent because util only measures "time with >=1 IO
  # in flight" and says nothing about remaining concurrency: a single-actuator HDD at 80%
  # is near saturation, while an NVMe can sit at 100% with one IO outstanding.
  util_half_pct:
    hdd: 80.0
    sata_ssd: 85.0
    nvme: 95.0
    usb: 80.0
    mmc: 80.0
    unknown: 95.0
  # Below this %util a disk is treated as ramping toward idle and its await/queue
  # sub-signals are scaled down, so a few background ops on an idle disk read as ~0.
  # A single number, NOT per media: %util is already a normalised time fraction, so
  # "almost nothing was in flight" means the same on every device.
  activity_util_pct: 20.0
  # Average per-IO latency (ms) that reads as 0.5.
  await_half_ms:
    hdd: 20.0
    sata_ssd: 5.0
    nvme: 1.0
    usb: 30.0
    mmc: 10.0
    unknown: 1.0
  # Average queue depth that reads as 0.5. A device advertising a SMALLER queue_depth in
  # sysfs lowers its own half-point; the value here is the ceiling, never raised by probing.
  queue_half:
    hdd: 3.0
    sata_ssd: 16.0
    nvme: 32.0
    usb: 1.0
    mmc: 2.0
    unknown: 32.0
  # How strongly the single worst disk dominates the aggregate:
  #   combined = 1 - (1 - avg_p) * (1 - max_p * max_p_weight)
  # 0 = plain mean (one saturated disk among many is averaged away); 1 = the worst disk
  # alone decides. Raise this if one hammered disk out of N should count for more.
  # It also bounds which machines can throttle AT ALL: with N physical disks, combined tops
  # out at 1 - (1 - 1/N)(1 - max_p_weight) even when the worst disk reads 1.0, and reaching
  # critical needs combined >= disk_thresholds.high, i.e. max_p_weight >= 1 - 0.2N/(N-1)
  # (0.70 for 3 disks, 0.75 for 5, -> 0.8 in the limit). 0.8 is therefore the lowest value
  # that keeps io.max reachable on a box with any number of disks -- lower it only after
  # checking that bound against the disk count of the target machines.
  max_p_weight: 0.8
weights:
  cpu: 1
  memory: 7
  io: 2
cpu_busy_threshold: 90
memory_busy_threshold: 80
mem_gate_steepness: 8  #Steepness of the memory scarcity sigmoid gate (larger = sharper transition around the memory busy point).
                       # 8 spreads low->critical over ~12 points of memory usage with ~2.5 in `medium`, which the staged
                       # limit/restore logic needs; 16 compresses that to ~6 points and ~1.2, and the EWMA + hysteresis
                       # filter can then miss `medium` entirely on a fast ramp, leaving only the emergency step.
controlled_apps:
  # Each entry supports five fields, which can be generated by wizard or manually added by users. The balancer uses these fields to
  # identify and monitor apps, and to provide user-friendly display names in notifications and logs:
  #   name        – display name;
  #   id          – unique identifier; used as DB primary key and for systemd
  #                 scope/service matching when applying resource limits
  #   commandline – command line of the main process; used by pgrep when
  #                 adjusting OOM scores; optional but recommended
  #   bpf_name    – list of executable names (comm/basename) that BPF should
  #                 watch for execve events to detect app launch/exit
  #   process_names – list of process names that belong to this app; if empty
  #                   the balancer uses the standard cgroup-based auto-discovery;
  #                   if non-empty these processes are looked up explicitly and
  #                   their resources are aggregated across all cgroups they may
  #                   reside in (useful for multi-process / multi-cgroup apps)
  # F.ex:
  # - name: "heliconSearch"
  #   id: "heliconsearch.id"
  #   commandline: "/usr/local/heliconsearch/HeliconSearch_agent"
  #   bpf_name: ["HeliconSearch_a", "VLMService"]
  #   process_names: ["HeliconSearch_agent", "VLMService"]
weights_top:
  cpu: 2
  memory: 7
  gpu: 5  #added to the default score as a secondary factor after GPU data is collected
passive_resource_control:
  enabled: true  #When disabled, the balancer no longer auto-monitors/throttles top apps on high system pressure; network control and manual throttling are unaffected

# set to [] for pure on-demand (no background collection).
# Valid: cpu, memory, pressure, network, disk, gpu, npu.
monitored_sections: [cpu, memory, pressure, network, disk, gpu, npu]
# Process noise filtered out from both top-resource sampling and the "Add App" wizard.
# Substring match against lower-cased comm / exe basename. Add app/process names
# here to hide them from monitoring & the wizard.
blacklist: [
  kworker, ksoftirqd, migration, rcu_, watchdog, systemd, dbus-, gdbus,
  gvfs, gvfsd, polkit, snapd, udisks, accounts-daemon, rtkit-, colord,
  packagekit, ibus-, fcitx, at-spi-, pipewire, pulseaudio, wireplumber,
  networkmanager, modemmanager, wpa_supplicant, avahi, cron, rsyslog, logind,
]
# Shells / tiny tools that are never the "app" a user wants to monitor. Used by
# the Add-App wizard to skip these when scanning /proc and when deriving
# process_names. Not exposed in the UI. If unset/empty a built-in default set is used.
shell_tools: [
  bash, sh, dash, zsh, fish, tcsh,
  sudo, su, env, which, getent,
  cat, head, tail, ls, find, xargs,
  grep, sed, awk, cut, sort, uniq, wc, tr, tee,
  ps, top, pgrep, pkill,
  true, false, sleep, kill,
  mv, cp, rm, ln, mkdir, rmdir, touch, chmod, chown,
]
cooldown_time: 15 # Cooldown period (seconds) to avoid frequent notifications
regular_update_sys_pressure_time: 5
monitor_idle_check_interval: 10  # Pressure check interval (seconds) when the balancer is idle
limit_reap_interval: 2  # How often (seconds) to check whether a limited app closed and restore its stale limit
app_priority:
  critical: 100
  high: 80
  medium: 50
  low: 20
limit_policy: # Default resource limit ratios for apps at different priority levels
  policy: "separated"  # combined: cpu/mem/disk IO limited under the same condition; separated: cpu/mem and disk IO evaluated independently
  cpu:
    enabled: true
    rate: # No limit for critical apps, so no ratio is configured for them
      high: 0.7  # 70% of total
      medium: 0.5
      low: 0.4
      undefined: 0.3
  memory:
    enabled: true
    rate:
      high: 0.3  # MemoryHigh soft limit
      medium: 0.2
      low: 0.1
      undefined: 0.1
  disk_io:  #
    enabled: true  # Whether to enable disk IO limits; passive limits are not applied uniformly by default — use the API to configure per-app active limits
    rate:
      # io.max enforces the bandwidth and the IOPS cap independently, so whichever is
      # reached first is the one the app actually feels. The IOPS numbers below all follow
      # `iops = MB/s * 300`, i.e. they only start to bind below a ~3.3 KB block size; at or
      # above that the MB/s figure is the effective cap and is what these classes promise.
      # Keep that ratio when tuning a class: an IOPS cap set independently silently becomes
      # the real limit for small blocks -- e.g. 1200 write_iops x 4 KB is only 4.7 MB/s.
      high:
        write: 50 # Default write limit: 50 MB/s
        read: 60 # Default read limit: 60 MB/s
        write_iops: 15000 # Default write IOPS: 15000 ops/s
        read_iops: 18000 # Default read IOPS: 18000 ops/s
      medium:
        write: 40
        read: 50
        write_iops: 12000
        read_iops: 15000
      low:
        write: 20
        read: 30
        write_iops: 6000
        read_iops: 9000
      undefined:
        write: 10
        read: 20
        write_iops: 1000
        read_iops: 8000
    # The `rate` table above is calibrated for NVMe. `media_scale` re-expresses it for
    # slower media: effective cap = rate[priority][field] * media_scale[media], applied to
    # the disk the app is actually hitting rather than to every disk at once. A single
    # coefficient per class (rather than a full media x priority x field table) is what
    # keeps the `iops = MB/s * 300` relationship above intact -- scaling bandwidth and IOPS
    # by the same factor preserves the block size at which the IOPS cap starts to bind,
    # whereas separate per-media IOPS values would break it on the first tuning pass.
    media_scale:
      nvme: 1.0        # the class `rate` was tuned against; NVMe behaviour is unchanged
      sata_ssd: 0.6
      mmc: 0.30        # eMMC/SD: ~50-100 MB/s sequential write
      hdd: 0.25        # ~120 MB/s sequential, ~1-2 MB/s random
      usb: 0.15        # USB 3 flash: ~20-40 MB/s write, USB 2 tops out near 30
      unknown: 1.0    # same as nvme -- see disk_pressure_model above
    # Minimum I/O an app must be doing ON A GIVEN DISK before capping it is worthwhile:
    # throttling a light user cannot relieve the device. EITHER floor qualifies, because
    # bandwidth alone would miss small-block random workloads, which move few MB but
    # saturate the device on IOPS -- on an HDD the iops floor is the one that fires, on an
    # NVMe usually the mb_s one.
    #
    # These are absolute, so they interact with contention: the more apps share a disk, the
    # smaller each one's share and the less likely any of them clears the floor. Measured on
    # a ~270 MB/s NVMe, 30 MB/s still catches the top app when up to ~9 apps are competing;
    # raise these only if throttling fires on apps too light to be worth capping.
    candidate_floor:
      nvme:
        mb_s: 30
        iops: 2000
      sata_ssd:
        mb_s: 20
        iops: 1200
      mmc:
        mb_s: 10
        iops: 400
      hdd:
        mb_s: 5
        iops: 60        # ~150 iops is a 7200 rpm disk's random ceiling
      usb:
        mb_s: 4
        iops: 50
      unknown:           # same as nvme
        mb_s: 30
        iops: 2000
# Network control switches. All are disabled by default.
enable_network_control: false  #Create and apply TC traffic classes to selected NICs.
enable_network_pressure_shaping: false  #Adjust TC bandwidth limits when fused network pressure changes.
enable_app_pps_police: false  #During a TX small-packet flood, cap lower-priority apps by packet rate.
# Small-packet flood policy. An app exceeding app_pps_high is capped at
# pps_cap_rate with the specified short burst when collective harm is detected.
network_pps_policy:
  app_pps_high: 50000    # PPS threshold for a lower-priority flood candidate
  pps_cap_rate: 10000    # Sustained PPS cap applied to a selected app
  pps_cap_burst: 2000    # Packets allowed above the sustained cap in a short burst
network_thresholds:
  low: 0.3
  medium: 0.5
  high: 0.7
  critical: 0.9
# NIC pressure calibration. Generic rx_dropped is driver/stack-specific, so it
# contributes only half-strength. Hardware receive overflow and softnet backlog drops
# remain full-strength capacity signals.
# Values are re-read by the monitor each sample; valid range is 0.0 to 1.0.
network_pressure_model:
  rx_drop_weight: 0.3
config_network_bw:  # ratio [0, 1] of NIC link bandwidth per network class
  system:
    min: 0.05
    max: 0.10
  critical:
    min: 0.55
    max: 0.90
  high:
    min: 0.30
    max: 0.80
  low:
    min: 0.10
    max: 1.00
network_burst_map:
  critical: "64k"
  high: "32k"
  low: "16k"
  system: "8k"
network_system_ports:
  - 22
  - 53
  - 80
  - 443
  - 123

network_interfaces: []
