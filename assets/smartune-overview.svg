<text x="448.21428571428567" y="669" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">iGPU</text>
<rect x="537.2857142857142" y="645" width="154.14285714285714" height="36" rx="7" fill="#23396f" stroke="#7f95c8" stroke-width="1.2"/>
<text x="614.3571428571428" y="669" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">dGPU</text>
<rect x="703.4285714285714" y="645" width="154.14285714285714" height="36" rx="7" fill="#23396f" stroke="#7f95c8" stroke-width="1.2"/>
<text x="780.5" y="669" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">NPU</text>
<rect x="869.5714285714286" y="645" width="154.14285714285714" height="36" rx="7" fill="#23396f" stroke="#7f95c8" stroke-width="1.2"/>
<text x="946.6428571428571" y="669" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Memory</text>
<rect x="1035.7142857142858" y="645" width="154.14285714285714" height="36" rx="7" fill="#23396f" stroke="#7f95c8" stroke-width="1.2"/>
<text x="1112.7857142857144" y="669" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Disk</text>
<rect x="1201.857142857143" y="645" width="154.14285714285714" height="36" rx="7" fill="#23396f" stroke="#7f95c8" stroke-width="1.2"/>
<text x="1278.9285714285716" y="669" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">Network</text>
<text x="780.5" y="717" font-size="14" fill="#dbe4ff" font-weight="normal" text-anchor="middle">Collection &amp; enforcement: XPU telemetry · Linux PSI · cgroup v2 · eBPF · driver / firmware interfaces</text>
